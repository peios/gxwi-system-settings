[package]
name = "gxwi-system-settings"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# libgxwi as of the gxwi release dev.peios.gxwi-sdk stages, which a package
# build takes it from (gxwi's dev/pins.toml).
libgxwi = { git = "https://github.com/peios/gxwi.git", rev = "e9d86e56e8d79b4240ff5114434b4cdc0c5b1f76" }
# The registry. Every crate in one program must pin the same revision:
# `peios-sys` links libpeios, and a program can hold only one.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f8c84930f2b71763bcf0550df0b1420a0f63b21e", package = "peios" }
# timed's socket, and what it accepts in Machine\System\Time.
libtimed = { git = "https://github.com/peios/timed.git", rev = "c1db503a60108542c8586c574802e5f2339dbcb4" }
# The rule for the machine's name.
libnetd = { git = "https://github.com/peios/netd.git", rev = "23af1f6b84f3764d9327eb009ced56b2a16b7aa8" }
# Which languages are installed, and what a session will honour.
libsession = { git = "https://github.com/peios/authd.git", rev = "1a421053deb0cf9703ee1e109db3792f7e1bb95d" }
# Who the local accounts are, for signing in at the console.
libauthd-client = { git = "https://github.com/peios/authd.git", rev = "1a421053deb0cf9703ee1e109db3792f7e1bb95d" }
libauthd = { git = "https://github.com/peios/authd.git", rev = "1a421053deb0cf9703ee1e109db3792f7e1bb95d" }
# Restarting the console-keymap service, and how this boot went.
peinit2 = { git = "https://github.com/peios/peinit.git", rev = "0e20fef16f3c170d8fba0e3a169b617e7b4da3aa", default-features = false }
libc = "0.2"
# The time, in the zone chosen.
jiff = "0.2.29"
[dev-dependencies]
# The events a window is sent carry a JSON value, which libgxwi re-exports.
serde_json = "1"
